services:
  - type: web
    name: disha-academy-test-portal
    env: python
    buildCommand: pip install -r requirements.txt && pip install opencv-python-headless && (pip uninstall -y opencv-python || true)
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FIREBASE_DATABASE_URL
        value: https://disha-academy-test-default-rtdb.firebaseio.com
